
name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://yckijwhegogzuqargwvv.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}"
